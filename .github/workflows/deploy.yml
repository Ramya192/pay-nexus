name: Deploy PayNexus

# Two independent jobs, matching how the two halves are actually hosted —
# backend as a container on Azure App Service (via Docker Hub), frontend as
# a static build on Azure Static Web Apps. See README.md's deployment
# section for the real Azure resource names/regions this targets.
on:
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Placeholders, not real secrets — several modules do real work at
      # import time: compression/context_compressor.py and
      # whatif_extraction.py construct an OpenAI(api_key=...) client (the
      # SDK treats an empty-string key as "missing" and raises
      # immediately), and db/database.py calls create_engine(DATABASE_URL)
      # (SQLAlchemy needs a syntactically valid URL to even construct the
      # engine, though it's lazy about actually connecting — route-level
      # tests override the DB dependency with in-memory SQLite, so this
      # fake Postgres URL is never actually connected to). Both crashed
      # test collection the first two times this workflow ran, found and
      # fixed one at a time rather than assumed away. Explicit
      # -m "not integration" is the actual gate that keeps real-API tests
      # from running, rather than relying on "is a key present" as a proxy
      # for that, which the OPENAI_API_KEY placeholder would otherwise defeat.
      - run: pytest -m "not integration"
        env:
          OPENAI_API_KEY: "sk-ci-placeholder-not-a-real-key"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/paynexus-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/paynexus-backend:${{ github.sha }}

      # No explicit "restart the App Service" step here — Continuous
      # Deployment is enabled directly on the App Service (a webhook Docker
      # Hub calls automatically on every push to the `:latest` tag), set up
      # once via `az webapp deployment container config --enable-cd true`.
      # Re-run that command if the webhook is ever lost (e.g. the App
      # Service is recreated).

  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Real build here (not the SWA action's own Oryx-based build) so the
      # exact same `npm run build` this project already verifies locally
      # runs in CI too — .env.production supplies VITE_API_BASE_URL, Vite
      # inlines it at build time (see src/api/client.ts's docstring).
      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
