name: Deploy PayNexus V2

# Deliberately a SEPARATE workflow file from deploy.yml, not a branch
# condition added to it -- keeps V1's deploy path (main -> paynexus-api /
# paynexus-web) completely untouched. Triggered by foundry-v2 (the Agent
# Framework/Foundry migration branch, now the sole active V2 line -- the
# old v2-dev branch was retired 2026-09-13, and this branch was renamed
# from foundry-v3 to foundry-v2 the same day once v2-dev was gone) so V2's
# still-evolving feature set never risks V1's production resources.
# Reuses the repo's existing DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets
# (not branch-scoped, already used by deploy.yml) but a SEPARATE Static
# Web Apps deployment token (AZURE_STATIC_WEB_APPS_API_TOKEN_V2) since
# each Static Web App resource has its own unique token. See README.md's
# Deployment section for the actual Azure resource names this targets.
on:
  push:
    branches: [foundry-v2]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Placeholders, not real secrets — several modules do real work at
      # import time: compression/context_compressor.py constructs an
      # OpenAI(api_key=...) client (the SDK treats an empty-string key as
      # "missing" and raises immediately, which crashed collection of
      # test_compression.py and test_orchestrator_v2.py the first time this
      # workflow ran on this branch (then named foundry-v3) — ported this
      # fix over from v2-dev's already-working version of this same
      # workflow, found and fixed there earlier rather than assumed away
      # here). Explicit
      # -m "not integration" is the actual gate that keeps real-API/DB
      # tests from running, rather than relying on "is a key present" as a
      # proxy for that, which the OPENAI_API_KEY placeholder would
      # otherwise defeat.
      - run: pytest -m "not integration" --cov=. --cov-report=term-missing
        env:
          OPENAI_API_KEY: "sk-ci-placeholder-not-a-real-key"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"

      # Not a coverage gate (a hard cutoff on % would need its own deliberate
      # decision about what floor is reasonable) — just makes the number
      # visible on every run's summary page instead of buried in the raw log.
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

      # Also not a hard gate — a new CVE landing shouldn't silently block
      # every deploy with no human decision. Surfaces known vulnerabilities
      # in pinned dependencies on every run instead of only when someone
      # remembers to run pip-audit locally (see README's Security section
      # for the one known, no-fix-available finding this already caught).
      - name: Dependency vulnerability scan
        if: always()
        run: |
          echo "### Dependency vulnerabilities (pip-audit)" >> $GITHUB_STEP_SUMMARY
          python -m pip_audit -r requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY || true

      # Static analysis of our own code (pip-audit above only covers
      # third-party dependency CVEs, not bugs in code we wrote). Also
      # non-blocking, same reasoning as pip-audit -- a new finding on
      # existing code shouldn't silently block a deploy with no human
      # decision. -ll skips low-severity noise on the summary; the full
      # report (all severities) is still in the uploaded JSON artifact
      # below for anyone who wants it.
      - name: Static security scan (bandit)
        if: always()
        run: |
          pip install bandit
          echo "### Static security scan (bandit)" >> $GITHUB_STEP_SUMMARY
          bandit -r . -x ./tests,./.venv -ll -f txt >> $GITHUB_STEP_SUMMARY || true
          bandit -r . -x ./tests,./.venv -f json -o bandit-report.json || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/paynexus-backend:v2-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/paynexus-backend:v2-${{ github.sha }}

      # Scans the image actually being deployed (OS packages + Python deps
      # baked into the layer), not just requirements.txt on disk -- catches
      # base-image CVEs pip-audit structurally can't see. Non-blocking, same
      # reasoning as pip-audit/bandit above: exit-code 0 means "report, don't
      # gate" -- a new base-image CVE landing shouldn't silently block every
      # deploy with no human decision.
      - name: Container vulnerability scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/paynexus-backend:v2-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          output: trivy-report.txt

      - name: Container scan summary
        if: always()
        run: |
          echo "### Container vulnerability scan (Trivy, HIGH/CRITICAL)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no report generated" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # No explicit "restart the App Service" step -- Continuous Deployment
      # is enabled directly on paynexus-api-v2 (a webhook Docker Hub calls
      # automatically on every push to the :v2-latest tag), same pattern
      # as V1. One manual one-time step: add that webhook URL (Azure
      # Portal -> paynexus-api-v2 -> Deployment Center -> shows it once
      # authenticated) to Docker Hub's ramya192/paynexus-backend repo,
      # scoped to the v2-latest tag. Re-add it if the App Service is ever
      # recreated.

  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # .env.production supplies VITE_API_BASE_URL (paynexus-api-v2's own
      # URL, not V1's) -- Vite inlines it at build time, same pattern as
      # V1's workflow. Real `npm run build`, not the SWA action's own
      # Oryx-based build, so exactly what's verified locally runs in CI.
      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_V2 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
