[pytest]
testpaths = tests
markers =
    integration: hits the real OpenAI API (and, for a couple of cases, the
        real pgvector index) — costs real money (cents) and needs
        OPENAI_API_KEY / DATABASE_URL set. Skipped automatically when those
        aren't set (see tests/conftest.py); run explicitly with
        `pytest -m integration`. Everything NOT marked this way is a pure,
        free, deterministic unit test — the bulk of this suite, and safe to
        run in any environment, on every change, with zero setup.
